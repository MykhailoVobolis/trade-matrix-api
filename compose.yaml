services:
  db:
    image: pgvector/pgvector:pg16
    container_name: trade-matrix-api-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trade_matrix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - trade-matrix-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trade_matrix']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    container_name: trade-matrix-api-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/trade_matrix?schema=public
    ports:
      - '8000:8000'

volumes:
  trade-matrix-db-data:
